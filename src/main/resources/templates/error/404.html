<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>DevTeck - Não encontrado</title>
    <link rel="stylesheet" th:href="@{/css/estilo.css}">
</head>
<body class="center-page">
    <div class="center-card">
        <h1>404 - Não encontrado</h1>
        <p th:if="${mensagem}" th:text="${mensagem}" class="alert alert-error">Recurso não encontrado.</p>
        <p th:unless="${mensagem}" class="alert alert-error">O recurso que você procura não existe.</p>
        <p style="margin-top: 1.5rem; text-align: center;">
            <a th:href="@{/}" class="btn">Voltar para a página inicial</a>
        </p>
    </div>
</body>
</html>
