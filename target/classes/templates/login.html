<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>DevTeck - Login</title>
    <link rel="stylesheet" th:href="@{/css/estilo.css}">
</head>
<body class="center-page">
    <div class="center-card">
        <h1>Entrar</h1>

        <p th:if="${erro}" th:text="${erro}" class="alert alert-error">Erro</p>

        <form th:action="@{/login}" method="post">
            <div class="field">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required>
            </div>
            <div class="field">
                <label for="senha">Senha</label>
                <input type="password" id="senha" name="senha" required>
            </div>
            <button type="submit" class="btn btn-block">Entrar</button>
        </form>

        <p style="margin-top: 1.5rem; text-align: center;">Não tem conta? <a th:href="@{/cadastro}">Criar conta</a></p>

        <p style="margin-top: 1.5rem; font-size: 0.8rem; color: #9ca3af; text-align: center;">
            Login de teste (Admin): admin@devteck.com / admin123<br>
            Login de teste (Cliente): joao@email.com / 123456
        </p>
    </div>
</body>
</html>
