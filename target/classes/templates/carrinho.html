<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>DevTeck - Carrinho de Compras</title>
    <link rel="stylesheet" th:href="@{/css/estilo.css}">
</head>
<body>
    <div th:replace="~{fragments/header :: cliente}"></div>

    <div class="container page-content">
        <h1>Carrinho de Compras</h1>

        <div class="table-wrap" th:if="${!#lists.isEmpty(itens)}">
            <table class="data-table">
                <thead>
                    <tr>
                        <th>Produto</th>
                        <th>Preço</th>
                        <th>Qtd</th>
                        <th>Subtotal</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="item : ${itens}">
                        <td th:text="${item.nome}">Nome</td>
                        <td th:text="'R$ ' + ${item.preco}">0.00</td>
                        <td>
                            <form th:action="@{/carrinho/atualizar}" method="post" style="display: flex; gap: 0.4rem; align-items: center;">
                                <input type="hidden" name="produtoId" th:value="${item.produtoId}">
                                <input class="qty-input" type="number" name="quantidade" th:value="${item.quantidade}" min="1" style="margin: 0;">
                                <button type="submit" class="btn btn-sm btn-outline">Atualizar</button>
                            </form>
                        </td>
                        <td th:text="'R$ ' + ${item.subtotal}">0.00</td>
                        <td>
                            <form th:action="@{/carrinho/remover}" method="post">
                                <input type="hidden" name="produtoId" th:value="${item.produtoId}">
                                <button type="submit" class="btn btn-danger btn-sm">Remover</button>
                            </form>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

        <p th:if="${#lists.isEmpty(itens)}" class="empty-state">Seu carrinho está vazio.</p>

        <div class="card summary-card" th:if="${!#lists.isEmpty(itens)}">
            <div class="summary-total">
                <span>Total</span>
                <span th:text="'R$ ' + ${carrinho.valorTotal}">R$ 0,00</span>
            </div>
        </div>

        <div class="form-actions">
            <a th:if="${!#lists.isEmpty(itens)}" th:href="@{/checkout}" class="btn">Finalizar Compra</a>
            <a th:href="@{/produtos}">Continuar Comprando</a>
        </div>
    </div>
</body>
</html>
