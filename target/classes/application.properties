spring.application.name=devteck

# Servidor
server.port=8080

# Banco de dados H2 em memoria (os dados somem quando a aplicacao para)
spring.datasource.url=jdbc:h2:mem:devteckdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Console web do H2, para visualizar as tabelas em http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Cria/atualiza as tabelas automaticamente a partir das entidades Java
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Habilita o suporte nativo do Spring ao Problem Details (RFC 9457) - TR07
spring.mvc.problemdetails.enabled=true

# Swagger / OpenAPI (springdoc) - TR07
# UI interativa disponivel em http://localhost:8080/swagger-ui.html
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.operationsSorter=method
